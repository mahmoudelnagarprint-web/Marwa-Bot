# ============================================================================
# Vision-Lab — تكوين Aider | عقدة اللابتوب (LAPTOP_NODE) | 2026-10-17
# ============================================================================
# هذا الملف لا يحوي أي مفاتيح أو أسرار ويجب أن يبقى كذلك دائماً.
# مفتاح الـ API يعيش في .env الخاصة بجذر المستودع (خارج المعمل، ومستثناة من Git
# بموجب .gitignore) — وسكربت scripts/run_aider.ps1 هو الذي يقرأه وقت التشغيل
# ويضعه في متغير البيئة OPENAI_API_KEY لعملية Aider فقط، دون طباعته في أي سجل.
#
# النموذج: عبر بوابة DAHL (متوافقة مع OpenAI) المتاحة على اللابتوب.
# ============================================================================

# النماذج المعروضة حالياً على البوابة (فحص حي 2026-10-17):
#   zai-org/GLM-5.3-Flash        ← المختار (سريع ومتخصص في الكود)
#   MiniMaxAI/MiniMax-M2.7
#   deepseek-ai/DeepSeek-V4-Flash-0731
model: openai/zai-org/GLM-5.3-Flash
openai-api-base: https://inference.dahl.global/v1

# سلوك آمن داخل معمل تُديره مزامنة Git تلقائية (كل ~15 دقيقة):
auto-commits: false        # لا يُcommit Aider بنفسه — مزامنة المالك تتولى ذلك
yes-always: true           # جاهز للتشغيل غير التفاعلي/البرمجي مباشرة
no-check-update: true
no-show-model-warnings: true
suggest-shell-commands: false
